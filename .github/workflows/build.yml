name: Build 3DS game

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            mossyhollow.3dsx
            mossyhollow.elf

  package:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-outputs

      - name: Get makerom and bannertool
        run: |
          mkdir tools && cd tools
          fetch() {
            repo="$1"; rx="$2"; out="$3"
            tag=$(gh api "repos/$repo/releases" --jq "[.[] | select(any(.assets[]; .name | test(\"$rx\"; \"i\")))][0].tag_name")
            name=$(gh api "repos/$repo/releases" --jq "[.[] | select(.tag_name==\"$tag\")][0].assets | map(select(.name | test(\"$rx\"; \"i\")))[0].name")
            echo "$repo -> tag $tag, file $name"
            gh release download "$tag" -R "$repo" -p "$name" -D "$out"
            (cd "$out" && case "$name" in
              *.zip) unzip -o "$name" ;;
              *.tar.*|*.tgz) tar xf "$name" ;;
            esac)
          }
          fetch 3DSGuy/Project_CTR 'makerom.*(ubuntu|linux).*x86_64' mr
          fetch carstene1ns/3ds-bannertool 'linux' bt
          find mr bt -type f
          cp "$(find mr -type f -name 'makerom*' ! -name '*.zip' ! -name '*.tar*' | head -n1)" makerom
          cp "$(find bt -type f \( -name bannertool -o -name 3ds-bannertool \) | head -n1)" bannertool
          chmod +x makerom bannertool

      - name: Make CIA
        run: |
          tools/bannertool makebanner -i banner.png -a audio.wav -o banner.bnr
          tools/bannertool makesmdh -s "Mossy Hollow" -l "A cute stealth crush game" -p "You" -i icon.png -o icon.icn
          tools/makerom -f cia -o mossyhollow.cia -elf mossyhollow.elf -rsf app.rsf -target t -exefslogo -banner banner.bnr -icon icon.icn

      - name: Make QR code
        run: |
          sudo apt-get update -y && sudo apt-get install -y qrencode
          qrencode -s 10 -m 2 -o qr.png "https://github.com/${{ github.repository }}/releases/download/latest/mossyhollow.cia"

      - name: Publish release
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest mossyhollow.cia mossyhollow.3dsx qr.png \
            --target "${{ github.sha }}" \
            --title "Mossy Hollow (latest build)" \
            --notes "Scan qr.png with FBI > Remote Install > Scan QR Code, or download the .cia / .3dsx."
