name: Build 3DS game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: mossyhollow
          path: mossyhollow.3dsx
