name: Build 3DS game

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            mossyhollow.3dsx
            mossyhollow.elf

  package:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-outputs

      - name: Get makerom and bannertool
        run: |
          mkdir tools && cd tools
          gh release download -R 3DSGuy/Project_CTR -p '*ubuntu*x86_64*' -D mr
          gh release download -R Steveice10/bannertool -p 'bannertool.zip' -D bt
          unzip -o mr/*.zip -d mr
          unzip -o bt/bannertool.zip -d bt
          cp "$(find mr -type f -name makerom | head -n1)" makerom
          cp "$(find bt -type f -path '*linux-x86_64*' -name bannertool | head -n1)" bannertool
          chmod +x makerom bannertool

      - name: Make CIA
        run: |
          tools/bannertool makebanner -i banner.png -a audio.wav -o banner.bnr
          tools/bannertool makesmdh -s "Mossy Hollow" -l "A cute stealth crush game" -p "You" -i icon.png -o icon.icn
          tools/makerom -f cia -o mossyhollow.cia -elf mossyhollow.elf -rsf app.rsf -target t -exefslogo -banner banner.bnr -icon icon.icn

      - name: Make QR code
        run: |
          sudo apt-get update -y && sudo apt-get install -y qrencode
          qrencode -s 10 -m 2 -o qr.png "https://github.com/${{ github.repository }}/releases/download/latest/mossyhollow.cia"

      - name: Publish release
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest mossyhollow.cia mossyhollow.3dsx qr.png \
            --target "${{ github.sha }}" \
            --title "Mossy Hollow (latest build)" \
            --notes "Scan qr.png with FBI > Remote Install > Scan QR Code, or download the .cia / .3dsx."
